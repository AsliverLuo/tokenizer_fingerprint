query_protocol:
  max_tokens: 1
  temperature: 0
  top_p: 1
  presence_penalty: 0
  frequency_penalty: 0
  system_prompt: 直接续写，不要解释，不要补充说明。
  stability_repeat_ratio: 0.1
  stability_repeat_count: 3
probes:
  total_count: 500
  categories:
    chinese_natural: 0.15
    english_natural: 0.15
    code: 0.15
    chinese_english_mixed: 0.1
    number_date_amount: 0.1
    json_yaml_markdown: 0.1
    url_path_email: 0.1
    truncated_partial: 0.15
  truncation_ratios:
  - 0.3
  - 0.5
  - 0.7
  - 0.9

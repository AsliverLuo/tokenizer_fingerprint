scoring:
  mode: bcs
  bcs:
    enabled_categories: null
  weights:
    char_length: 0.25
    byte_length: 0.25
    token_type: 0.25
    transition: 0.25
  thresholds:
    ood_threshold: 0.4
    family_threshold: 0.7
    wrapped_threshold: 0.85
    variance_threshold: 0.15
  bootstrap:
    n_iterations: 100
    sample_ratio: 0.8
evaluation:
  query_budgets:
  - 50
  - 100
  - 200
  - 300
  - 500
  cross_lingual_subsets:
  - chinese
  - english
  - code
  - mixed
